<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solistpan 決勝審査会</title>
<link rel="stylesheet" href="deck.css?v=20261024-3">
<style>
.toolbar{position:fixed;right:20px;bottom:20px;z-index:50;display:flex;gap:8px;padding:8px;border-radius:14px;background:#000b;opacity:0;transition:opacity .25s}
.toolbar.show{opacity:1}
.toolbar button{font:inherit;font-size:16px;padding:8px 14px;border:1px solid #556;border-radius:8px;background:#1a2735;color:#e8eef3;cursor:pointer}
.toolbar button:hover{background:#27405a}
.counter{align-self:center;color:#9bb0c0;font-size:15px;padding:0 8px}
.host{grid-area:1/1;width:100%;height:100%;display:grid;place-items:center}
#demoHost{grid-area:1/1;place-self:center;pointer-events:none;z-index:10}
#sceneHost{grid-area:1/1;place-self:center;pointer-events:none;z-index:20;overflow:hidden}
.pan{position:absolute;left:calc(480px*var(--s));top:calc(200px*var(--s));width:calc(960px*var(--s));height:calc(640px*var(--s));object-fit:cover;border-radius:calc(18px*var(--s));box-shadow:0 calc(14px*var(--s)) calc(48px*var(--s)) #000a;opacity:0;transition:opacity 1s ease}
.pan.on{opacity:1}
.pan-caption{position:absolute;left:0;right:0;bottom:calc(36px*var(--s));text-align:center;color:#fff;font-size:calc(40px*var(--s));font-weight:800;text-shadow:0 2px 12px #000c;opacity:0;transition:opacity 1s ease}
.pan-caption.on{opacity:1}
.pan-credit{position:absolute;right:calc(24px*var(--s));bottom:calc(14px*var(--s));color:#fff;font-size:calc(22px*var(--s));text-shadow:0 1px 6px #000d;opacity:0;transition:opacity 1s ease}
.pan-credit.on{opacity:.9}
.demo-layer{pointer-events:none;position:absolute;display:block;visibility:hidden;z-index:10;background:transparent}
.demo-layer.on{pointer-events:auto;visibility:visible}
.demo-layer iframe,.demo-layer video{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}
.demo-layer video{background:#000;object-fit:contain}
.demo-layer .hidden{display:none}
.hint{position:fixed;left:20px;bottom:20px;z-index:50;color:#9bb0c0;font-size:15px;opacity:0;transition:opacity .25s}
.hint.show{opacity:1}
</style>
</head>
<body>
<div class="viewport" id="viewport"><div class="host" id="slideHost"></div><div class="stage-box" id="demoHost"></div><div class="stage-box" id="sceneHost"><img class="pan" id="steelpan" src="../assets/presentation/steelpan.jpg" alt="スチールパン"><div class="pan-caption" id="panCaption">スチールパン(トリニダード・トバゴ)</div><div class="pan-credit" id="panCredit">Photo: Terry Ballard / CC BY 2.0 (Wikimedia Commons)</div></div></div>
<div class="toolbar" id="toolbar">
  <button id="prev" title="前へ (←)">◀</button><span class="counter" id="counter"></span><button id="next" title="次へ (→)">▶</button>
  <button id="presenter" title="プレゼンター画面を開く (P)">プレゼンター</button>
  <button id="full" title="全画面 (F)">全画面</button>
</div>
<div class="hint" id="hint">→ 次へ / ← 前へ / F 全画面 / P プレゼンター / B 黒画面 / R 最初へ</div>
<script src="slides.js?v=20261024-3"></script>
<script src="sync.js?v=20261020-5"></script>
<script src="deck.js?v=20261020-5"></script>
<script src="deck-audio.js?v=20261020-5"></script>
<script src="main.js?v=20261022-3"></script>
</body>
</html>
