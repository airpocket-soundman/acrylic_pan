<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="t d">
<title id="t">Solist-AI ボード CN3 と KX134-1211-EVK-001 J1 の接続図</title>
<desc id="d">CN3の5と8番(3.3V)がJ1の1と6番、GNDの2番が8番、CSの14番が2番、SCKの12番が5番、MOSIの9番が7番、MISOの10番が9番、INT1の7番が11番、INT2の6番が12番へつながる。</desc>
<style>text{font-family:"Yu Gothic UI","Noto Sans JP",Meiryo,Arial,sans-serif;fill:#10212b}.h{font-size:26px;font-weight:700}.s{font-size:15px;fill:#60727a}.b{font-size:17px;font-weight:700}.m{font-size:13px}.p{font-size:14px;font-weight:700;fill:#fff}.pn{font-size:12px;fill:#60727a}.w{font-size:15px;font-weight:700}</style>
<rect width="1200" height="940" fill="#f5f6f2"/>
<text x="600" y="44" text-anchor="middle" class="h">センサ接続: Solist-AI ボード CN3 → KX134-1211-EVK-001 J1</text>
<text x="600" y="72" text-anchor="middle" class="s">SPI接続(3.3 V)。ストレートの14ピンケーブルは使えません。必ず「ピン番号」で配線します。</text>
<text x="60" y="92" class="b">Solist-AI ボード DT-EBML63Q2557  CN3</text>
