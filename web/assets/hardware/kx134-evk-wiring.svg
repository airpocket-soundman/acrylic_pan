<rect x="60" y="834" width="1080" height="150" rx="10" fill="#fff" stroke="#d7dfdd" stroke-width="2"/>
<text x="80" y="864" class="m">・CN3の1・3番(SCL/SDA)はSPIでは使いません。J1の3・4・13・14番(未割り当て)と10番(TRIG、基板上で10 kΩプルダウン)は接続しません。</text>
<text x="80" y="890" class="m">・CN3の4・11・13番もGNDです。必要なら追加のGND線として使えます。</text>
<text x="80" y="916" class="m">・DT-EBML63Q2557の JP1 は 3.3 V にします。デジタル入力の最大定格は3.6 Vで、5 Vを接続してはいけません。</text>
<text x="80" y="942" class="m">・EVK上にプルアップ(nCS 10 kΩ、SCLK/SDI 2.1 kΩ、SDO 10 kΩ)があります。IO_VDD(J1-6)に3.3 Vが無いとSPIが動きません。</text>
<text x="80" y="968" class="m">・コネクタの向きはこの図の見た目ではなく、基板の「1」表示(三角印・角パッド)で確認します。</text>
<rect x="60" y="1000" width="1080" height="46" rx="10" fill="#fff0f0" stroke="#d74040" stroke-width="2"/>
<text x="600" y="1030" text-anchor="middle" font-size="19" font-weight="700" style="fill:#b32323">VDD と IO_VDD は両方とも 3.3 V。どちらも 5 V に接続しない。</text>
</svg>