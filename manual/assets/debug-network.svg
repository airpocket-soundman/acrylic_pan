<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">デバッグ時のPCとラズパイのネットワーク接続</title><desc id="desc">方法1はEthernetケーブルでPCとラズパイを直結。方法2は有線LANまたはWi-Fiで両方を同じネットワークへ接続。</desc>
<defs><style>text{font-family:'Yu Gothic',Meiryo,sans-serif;fill:#15313c}.h{font-size:21px;font-weight:700}.name{font-size:20px;font-weight:700}.sub{font-size:15px;fill:#526b74}.box{fill:white;stroke:#96b7bc;stroke-width:2}.wire{fill:none;stroke:#007f80;stroke-width:4}.wifi{fill:none;stroke:#007f80;stroke-width:3;stroke-dasharray:9 7}</style></defs>
<rect width="1000" height="560" rx="12" fill="#f6faf9"/>
<text x="32" y="43" class="h">デバッグ時だけPCをネットワーク接続</text>
<text x="32" y="98" class="h">方法1　Ethernetケーブルで直結</text>
<rect class="box" x="45" y="125" width="210" height="85" rx="10"/><text x="150" y="177" class="name" text-anchor="middle">PC</text>
<rect class="box" x="745" y="125" width="210" height="85" rx="10"/><text x="850" y="177" class="name" text-anchor="middle">Raspberry Pi</text>
<path class="wire" d="M255 167H745"/><text x="500" y="151" class="sub" text-anchor="middle">Ethernetケーブル（有線LAN）</text>
<path d="M32 250H968" stroke="#d7e2e4"/>
<text x="32" y="296" class="h">方法2　有線LANまたはWi-Fiで同じネットワークへ接続</text>
<rect class="box" x="45" y="345" width="210" height="90" rx="10"/><text x="150" y="400" class="name" text-anchor="middle">PC</text>
<rect x="405" y="330" width="190" height="120" rx="10" fill="#e2f2ee" stroke="#007f80" stroke-width="2"/><text x="500" y="375" class="name" text-anchor="middle">ルーター / AP</text><text x="500" y="406" class="sub" text-anchor="middle">同じネットワーク</text>
<rect class="box" x="745" y="345" width="210" height="90" rx="10"/><text x="850" y="400" class="name" text-anchor="middle">Raspberry Pi</text>
<path class="wire" d="M255 373H405M595 373H745"/><path class="wifi" d="M255 413H405M595 413H745"/>
<text x="330" y="352" class="sub" text-anchor="middle">Ethernet</text><text x="670" y="352" class="sub" text-anchor="middle">Ethernet</text><text x="330" y="445" class="sub" text-anchor="middle">または Wi-Fi</text><text x="670" y="445" class="sub" text-anchor="middle">または Wi-Fi</text>
<text x="32" y="505" class="sub">実線：有線LAN　　破線：Wi-Fi（接続方式を選択）</text>
<text x="32" y="535" class="sub">通常のスタンドアロン演奏では、PCとの接続は不要です。</text>
</svg>
