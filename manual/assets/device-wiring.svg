<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc">
<title id="title">Solistpanの機器接続図</title><desc id="desc">Solist-AIと加速度センサを専用ケーブル、ラズパイとSolist-AIをUSB A-C、マウスとカメラをUSB A、モニターをHDMI micro-miniで接続。最後にType-Cでラズパイへ給電。</desc>
<defs><style>text{font-family:'Yu Gothic',Meiryo,sans-serif;fill:#15313c}.title{font-size:24px;font-weight:700}.name{font-size:21px;font-weight:700}.sub{font-size:15px;fill:#526b74}.label{font-size:16px;font-weight:700;paint-order:stroke;stroke:#f6faf9;stroke-width:7;stroke-linejoin:round}.port{font-size:14px;fill:#007f80;font-weight:700}.box{fill:white;stroke:#96b7bc;stroke-width:2}.wire{fill:none;stroke:#007f80;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#d45c2c"/></marker></defs>
<rect width="1000" height="660" rx="12" fill="#f6faf9"/>
<text x="32" y="43" class="title">機器の接続関係</text><text x="32" y="72" class="sub">各機器を配線し、最後にラズパイへ給電する</text>
<rect class="box" x="32" y="120" width="210" height="100" rx="10"/><text x="137" y="160" text-anchor="middle" class="name">加速度センサ</text><text x="137" y="190" text-anchor="middle" class="sub">アクリル板に取り付け</text>
<rect class="box" x="390" y="120" width="240" height="100" rx="10"/><text x="510" y="160" text-anchor="middle" class="name">Solist-AI</text><text x="510" y="190" text-anchor="middle" class="sub">位置推論・追加学習</text>
<path class="wire" d="M242 170H390"/><text x="316" y="153" text-anchor="middle" class="label">専用ケーブル</text>
<rect x="355" y="335" width="310" height="190" rx="12" fill="#e2f2ee" stroke="#007f80" stroke-width="3"/><text x="510" y="385" text-anchor="middle" class="name">Raspberry Pi</text><text x="510" y="416" text-anchor="middle" class="sub">画面表示・発音・カメラ</text><text x="510" y="449" text-anchor="middle" class="sub">USB / micro HDMI / 電源</text>
<path class="wire" d="M510 220V335"/><text x="530" y="243" class="port">Type-C</text><text x="530" y="283" class="label">USB A–C</text><text x="530" y="323" class="port">Type-A</text>
<rect class="box" x="32" y="325" width="190" height="75" rx="10"/><text x="127" y="370" text-anchor="middle" class="name">マウス</text><path class="wire" d="M222 362H355"/><text x="288" y="347" text-anchor="middle" class="label">USB A</text>
<rect class="box" x="32" y="450" width="190" height="75" rx="10"/><text x="127" y="495" text-anchor="middle" class="name">カメラ</text><path class="wire" d="M222 487H355"/><text x="288" y="472" text-anchor="middle" class="label">USB A</text>
<rect class="box" x="780" y="335" width="190" height="130" rx="10"/><rect x="805" y="352" width="140" height="66" rx="3" fill="#edf5f5" stroke="#96b7bc"/><text x="875" y="380" text-anchor="middle" class="sub">モバイル</text><text x="875" y="403" text-anchor="middle" class="sub">モニター</text><text x="875" y="445" text-anchor="middle" class="port">mini HDMI</text>
<path class="wire" d="M665 385H780"/><text x="722" y="320" text-anchor="middle" class="label">HDMI</text><text x="722" y="344" text-anchor="middle" class="sub">micro–mini</text><text x="672" y="411" class="port">micro HDMI</text>
<rect x="780" y="550" width="190" height="70" rx="10" fill="#fff3e9" stroke="#d45c2c" stroke-width="2"/><text x="875" y="593" text-anchor="middle" class="name">電源</text><path d="M780 585H510V525" fill="none" stroke="#d45c2c" stroke-width="4" marker-end="url(#arrow)"/><text x="620" y="570" class="label" style="fill:#b14c24">最後にType-Cから給電</text>
<text x="32" y="625" class="sub">USB A / C はUSB Type-A / Type-Cを示します。</text>
</svg>
