<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
  <rect width="1400" height="1000" fill="#f7f9fc"/>
  <style>
    text{font-family:Arial,"Noto Sans JP",sans-serif;fill:#172033}.title{font-size:38px;font-weight:700}.sub{font-size:19px;fill:#526079}.head{font-size:24px;font-weight:700}.label{font-size:17px;font-weight:700}.small{font-size:14px;fill:#526079}.tiny{font-size:11px;font-weight:700}.connector text{fill:#fff}.board{fill:#087f84;stroke:#075b60;stroke-width:5}.part{fill:#13323d;stroke:#071b22;stroke-width:2}.metal{fill:#aeb9bb;stroke:#6f7f82;stroke-width:2}.hole{fill:#f8fbfa;stroke:#a8b8b8;stroke-width:4}.hdr{fill:#17262c}.pin{fill:#bdc8c8;stroke:#637476;stroke-width:1}.used{stroke:#fff;stroke-width:3}.call{fill:#fff;stroke-width:3}.wire{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.pwr{stroke:#d84437}.gnd{stroke:#1f272a}.sck{stroke:#2877c7}.miso{stroke:#15936f}.mosi{stroke:#e27b23}.cs{stroke:#854fc6}.int1{stroke:#c79b00}.int2{stroke:#008da3}.nc{fill:#eef1ef;stroke:#9aa6a8;stroke-width:2;stroke-dasharray:6 5}
  </style>
  <text x="700" y="52" text-anchor="middle" class="title">KX132-1211-EVK-001 to Arduino UNO Q Pin Layout</text>
  <text x="700" y="84" text-anchor="middle" class="sub">USB-C at top - all Arduino-compatible POWER, ANALOG and DIGITAL sockets are shown</text>

  <!-- KX132 EVK J1 physical header -->
  <g transform="translate(42 118)">
    <text x="0" y="0" class="head">KX132-1211-EVK-001 J1</text>
    <text x="0" y="26" class="small">Breakout/evaluation board, component side</text>
    <rect x="0" y="42" width="390" height="162" rx="8" fill="#102733" stroke="#557078" stroke-width="3"/>
    <g text-anchor="middle" fill="#fff" class="tiny connector">
      <g transform="translate(30 156)"><circle r="14" fill="#d84437" stroke="#fff" stroke-width="2"/><text y="4" fill="#fff">1</text><text y="32" fill="#fff">VDD</text></g>
      <g transform="translate(85 156)"><circle r="14" fill="#9ba4b0" stroke="#fff" stroke-width="2"/><text y="4" fill="#fff">3</text><text y="32" fill="#fff">X</text></g>
      <g transform="translate(140 156)"><circle r="14" fill="#2877c7" stroke="#fff" stroke-width="2"/><text y="4" fill="#fff">5</text><text y="32" fill="#fff">SCLK</text></g>
      <g transform="translate(195 156)"><circle r="14" fill="#e27b23" stroke="#fff" stroke-width="2"/><text y="4" fill="#fff">7</text><text y="32" fill="#fff">SDI</text></g>
      <g transform="translate(250 156)"><circle r="14" fill="#15936f" stroke="#fff" stroke-width="2"/><text y="4" fill="#fff">9</text><text y="32" fill="#fff">SDO</text></g>
      <g transform="translate(305 156)"><circle r="14" fill="#c79b00" stroke="#fff" stroke-width="2"/><text y="4" fill="#fff">11</text><text y="32" fill="#fff">INT1</text></g>
      <g transform="translate(360 156)"><circle r="14" fill="#9ba4b0" stroke="#fff" stroke-width="2"/><text y="4" fill="#fff">13</text><text y="32" fill="#fff">NC</text></g>
      <g transform="translate(30 78)"><circle r="14" fill="#854fc6" stroke="#fff" stroke-width="2"/><text y="4" fill="#fff">2</text><text y="32" fill="#fff">nCS</text></g>
      <g transform="translate(85 78)"><circle r="14" fill="#9ba4b0" stroke="#fff" stroke-width="2"/><text y="4" fill="#fff">4</text><text y="32" fill="#fff">Y</text></g>
      <g transform="translate(140 78)"><circle r="14" fill="#d84437" stroke="#fff" stroke-width="2"/><text y="4" fill="#fff">6</text><text y="32" fill="#fff">IOVDD</text></g>
      <g transform="translate(195 78)"><circle r="14" fill="#1f272a" stroke="#fff" stroke-width="2"/><text y="4" fill="#fff">8</text><text y="32" fill="#fff">GND</text></g>
      <g transform="translate(250 78)"><circle r="14" fill="#9ba4b0" stroke="#fff" stroke-width="2"/><text y="4" fill="#fff">10</text><text y="32" fill="#fff">NC</text></g>
      <g transform="translate(305 78)"><circle r="14" fill="#008da3" stroke="#fff" stroke-width="2"/><text y="4" fill="#fff">12</text><text y="32" fill="#fff">INT2</text></g>
      <g transform="translate(360 78)"><circle r="14" fill="#9ba4b0" stroke="#fff" stroke-width="2"/><text y="4" fill="#fff">14</text><text y="32" fill="#fff">NC</text></g>
    </g>
  </g>

  <!-- UNO Q board -->
  <g>
    <path class="board" d="M500 165 Q500 150 515 150 H865 Q880 150 880 165 V820 H848 L826 852 H554 L532 820 H500 Z"/>
    <rect class="metal" x="646" y="116" width="88" height="64" rx="7"/><text class="small" x="690" y="106" text-anchor="middle">USB-C</text>
    <circle class="hole" cx="528" cy="205" r="16"/><circle class="hole" cx="852" cy="205" r="16"/><circle class="hole" cx="540" cy="795" r="16"/><circle class="hole" cx="840" cy="795" r="16"/>
    <rect x="530" y="190" width="120" height="76" rx="7" fill="#6f9c38" stroke="#bdd87c"/><rect class="part" x="630" y="356" width="128" height="120" rx="5"/><text x="694" y="421" text-anchor="middle" fill="#e7f3f1" class="label">QRB2210</text><rect class="part" x="767" y="356" width="82" height="120" rx="5"/><text x="808" y="421" text-anchor="middle" fill="#e7f3f1" class="tiny">LPDDR4</text><rect class="metal" x="588" y="575" width="126" height="108" rx="5"/><text class="label" x="651" y="635" text-anchor="middle">STM32U585</text><text x="690" y="756" text-anchor="middle" fill="#e7f3f1" class="label">ARDUINO UNO Q</text>

    <!-- Auxiliary onboard connectors, shown for orientation -->
    <g transform="translate(680 202)"><text x="30" y="0" text-anchor="middle" fill="#e7f3f1" class="tiny">JSPI</text><rect x="0" y="10" width="60" height="78" rx="4" class="hdr"/><g class="tiny" text-anchor="middle"><rect class="pin" x="9" y="19" width="14" height="14"/><rect class="pin" x="37" y="19" width="14" height="14"/><rect class="pin" x="9" y="41" width="14" height="14"/><rect class="pin" x="37" y="41" width="14" height="14"/><rect class="pin" x="9" y="63" width="14" height="14"/><rect class="pin" x="37" y="63" width="14" height="14"/></g></g>
    <g transform="translate(772 202)"><text x="36" y="0" text-anchor="middle" fill="#e7f3f1" class="tiny">QWIIC</text><rect x="0" y="10" width="72" height="30" rx="4" class="hdr"/><rect class="pin" x="7" y="18" width="11" height="14"/><rect class="pin" x="23" y="18" width="11" height="14"/><rect class="pin" x="39" y="18" width="11" height="14"/><rect class="pin" x="55" y="18" width="11" height="14"/></g>

    <!-- POWER header -->
    <rect class="hdr" x="472" y="312" width="30" height="232" rx="4"/>
    <g class="small"><rect class="pin" x="479" y="320" width="16" height="16"/><text x="462" y="333" text-anchor="end">BOOT</text><rect class="pin" x="479" y="348" width="16" height="16"/><text x="462" y="361" text-anchor="end">IOREF</text><rect class="pin" x="479" y="376" width="16" height="16"/><text x="462" y="389" text-anchor="end">RESET</text><rect class="pin used" x="479" y="404" width="16" height="16" fill="#d84437"/><text x="514" y="417" fill="#d84437">3.3V</text><rect class="pin" x="479" y="432" width="16" height="16"/><text x="462" y="445" text-anchor="end">5V</text><rect class="pin used" x="479" y="460" width="16" height="16" fill="#1f272a"/><text x="514" y="473">GND</text><rect class="pin" x="479" y="488" width="16" height="16"/><text x="462" y="501" text-anchor="end">GND</text><rect class="pin" x="479" y="516" width="16" height="16"/><text x="462" y="529" text-anchor="end">VIN</text></g>

    <!-- ANALOG header: all six sockets -->
    <text x="487" y="584" text-anchor="middle" fill="#e7f3f1" class="tiny">ANALOG</text>
    <rect class="hdr" x="472" y="596" width="30" height="176" rx="4"/>
    <g class="small"><rect class="pin" x="479" y="604" width="16" height="16"/><text x="514" y="617">A0 / D14</text><rect class="pin" x="479" y="632" width="16" height="16"/><text x="514" y="645">A1 / D15</text><rect class="pin" x="479" y="660" width="16" height="16"/><text x="514" y="673">A2 / D16</text><rect class="pin" x="479" y="688" width="16" height="16"/><text x="514" y="701">A3 / D17</text><rect class="pin" x="479" y="716" width="16" height="16"/><text x="514" y="729">A4 / D18</text><rect class="pin" x="479" y="744" width="16" height="16"/><text x="514" y="757">A5 / D19</text></g>

    <!-- DIGITAL header -->
    <rect class="hdr" x="878" y="254" width="30" height="534" rx="4"/>
    <g class="small">
      <rect class="pin" x="885" y="262" width="16" height="16"/><text x="918" y="275">D21</text><rect class="pin" x="885" y="290" width="16" height="16"/><text x="918" y="303">D20</text><rect class="pin" x="885" y="318" width="16" height="16"/><text x="918" y="331">AREF</text><rect class="pin" x="885" y="346" width="16" height="16"/><text x="918" y="359">GND</text>
      <rect class="pin used" x="885" y="374" width="16" height="16" fill="#2877c7"/><text x="918" y="387" fill="#2877c7">D13</text><rect class="pin used" x="885" y="402" width="16" height="16" fill="#15936f"/><text x="918" y="415" fill="#15936f">D12</text><rect class="pin used" x="885" y="430" width="16" height="16" fill="#e27b23"/><text x="918" y="443" fill="#e27b23">D11</text><rect class="pin used" x="885" y="458" width="16" height="16" fill="#854fc6"/><text x="918" y="471" fill="#854fc6">D10</text><rect class="pin" x="885" y="486" width="16" height="16"/><text x="918" y="499">D9</text><rect class="pin" x="885" y="514" width="16" height="16"/><text x="918" y="527">D8</text>
      <rect class="pin" x="885" y="550" width="16" height="16"/><text x="918" y="563">D7</text><rect class="pin" x="885" y="578" width="16" height="16"/><text x="918" y="591">D6</text><rect class="pin" x="885" y="606" width="16" height="16"/><text x="918" y="619">D5</text><rect class="pin" x="885" y="634" width="16" height="16"/><text x="918" y="647">D4</text><rect class="pin used" x="885" y="662" width="16" height="16" fill="#008da3"/><text x="918" y="675" fill="#008da3">D3</text><rect class="pin used" x="885" y="690" width="16" height="16" fill="#c79b00"/><text x="918" y="703" fill="#9b7900">D2</text><rect class="pin" x="885" y="718" width="16" height="16"/><text x="918" y="731">D1</text><rect class="pin" x="885" y="746" width="16" height="16"/><text x="918" y="759">D0</text>
    </g>
  </g>

  <!-- Power callouts -->
  <g>
    <rect class="call pwr" x="42" y="388" width="365" height="74" rx="8"/><text class="label" x="60" y="416">J1-1 VDD + J1-6 IO_VDD</text><text class="small" x="60" y="443">UNO Q POWER: 3.3V</text><path class="wire pwr" d="M407 425 H448 V412 H479"/>
    <rect class="call gnd" x="42" y="482" width="365" height="68" rx="8"/><text class="label" x="60" y="510">J1-8 GND</text><text class="small" x="60" y="536">UNO Q POWER: GND</text><path class="wire gnd" d="M407 516 H448 V468 H479"/>
    <rect class="nc" x="42" y="576" width="365" height="92" rx="8"/><text class="label" x="60" y="606">Leave open (NC)</text><text class="small" x="60" y="632">J1-3 X_OUT / 4 Y_OUT / 10 TRIG</text><text class="small" x="60" y="654">J1-13 nRES / 14 Z_OUT</text>
  </g>

  <!-- Digital callouts -->
  <g>
    <path class="wire sck" d="M901 382 H1010"/><rect class="call sck" x="1010" y="354" width="348" height="56" rx="7"/><text class="label" x="1028" y="378">J1-5 SCLK</text><text class="small" x="1028" y="399">UNO Q: D13 / SCK</text>
    <path class="wire miso" d="M901 410 H990 V440 H1010"/><rect class="call miso" x="1010" y="418" width="348" height="56" rx="7"/><text class="label" x="1028" y="442">J1-9 SDO</text><text class="small" x="1028" y="463">UNO Q: D12 / CIPO</text>
    <path class="wire mosi" d="M901 438 H974 V504 H1010"/><rect class="call mosi" x="1010" y="482" width="348" height="56" rx="7"/><text class="label" x="1028" y="506">J1-7 SDI</text><text class="small" x="1028" y="527">UNO Q: D11 / COPI</text>
    <path class="wire cs" d="M901 466 H958 V568 H1010"/><rect class="call cs" x="1010" y="546" width="348" height="56" rx="7"/><text class="label" x="1028" y="570">J1-2 nCS</text><text class="small" x="1028" y="591">UNO Q: D10 / SS</text>
    <path class="wire int2" d="M901 670 H974 V632 H1010"/><rect class="call int2" x="1010" y="610" width="348" height="56" rx="7"/><text class="label" x="1028" y="634">J1-12 INT2 (optional)</text><text class="small" x="1028" y="655">UNO Q: D3 / PB0</text>
    <path class="wire int1" d="M901 698 H990 V696 H1010"/><rect class="call int1" x="1010" y="674" width="348" height="56" rx="7"/><text class="label" x="1028" y="698">J1-11 INT1 / DRDY</text><text class="small" x="1028" y="719">UNO Q: D2 / PB3</text>
  </g>

  <rect x="175" y="900" width="1050" height="64" rx="10" fill="#fff0f0" stroke="#d74040" stroke-width="2"/>
  <text x="700" y="928" text-anchor="middle" font-size="21" font-weight="700" fill="#b32323">Both VDD and IO_VDD connect to 3.3 V - never connect either pin to 5 V</text>
  <text x="700" y="951" text-anchor="middle" class="small">Unused sockets are gray. JSPI and QWIIC are shown for orientation and are not used for this sensor.</text>
</svg>
